name: E2E Public

# Specs Playwright "públicos" — sem login e sem MercadoPago (home, cart,
# catalog, navigation, product, institutional). Rodam via `--project=public`,
# que filtra pela convenção de nomes (ignora *.auth.spec.ts e *.mp.spec.ts),
# em vez de listar arquivos: adicionar/renomear um spec público não exige
# mexer neste YAML.
#
# Disparado por `pull_request` (igual ao `Test` e ao `e2e-checkout-mp`), com
# path filter coarse-grain. Roda em paralelo aos demais workflows; o acesso ao
# Firestore luratha-96386 é serializado pela `concurrency` de job
# `luratha-96386-e2e`, compartilhada com `Test → e2e-auth` e `e2e-checkout-mp`.
#
# NÃO é required em branch protection: quando o path filter não casa, o
# workflow nem aparece como check; PR segue mergeável.

on:
  pull_request:
    branches: [master, production]
    paths:
      # Coarse-grain (issue #161). O filtro folha não segue o grafo de
      # dependências: código consumido transitivamente pelos specs públicos —
      # ex. `@luratha/firestore/firebaseAdmin` ou `@luratha/core/logging/logger`
      # — não dispararia o workflow, deixando regressões passarem. Cobrimos a
      # storefront inteira + todos os packages. Custo aceito: alguns runs
      # falso-positivos (ex.: mudança só em checkout roda o E2E público à toa).
      - 'apps/store/**'
      - 'packages/**'
      - '.github/workflows/e2e-public.yml'
  workflow_dispatch:

# Cancela runs anteriores do MESMO PR (não cross-PR). Cross-PR é coberto
# pela `concurrency` interna do job (luratha-96386-e2e), que serializa
# com o `Test → e2e-auth` e o `e2e-checkout-mp` no mesmo Firestore project.
concurrency:
  group: e2e-public-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  e2e-public:
    name: E2E public (Playwright + cloud)
    runs-on: ubuntu-latest
    # Mesma concurrency group do `Test → e2e-auth` e do `e2e-checkout-mp` pra
    # evitar 2 runs simultâneas contra o Firestore luratha-96386.
    concurrency:
      group: luratha-96386-e2e
      cancel-in-progress: false
    env:
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
      FIREBASE_WEB_APP_CONFIG_BASE64: ${{ secrets.FIREBASE_WEB_APP_CONFIG_BASE64 }}
      FIREBASE_PROJECT_ID: luratha-96386
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: luratha-96386
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
    steps:
      - name: Verify cloud test secrets are configured
        id: check_secrets
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_BASE64" ] || [ -z "$FIREBASE_WEB_APP_CONFIG_BASE64" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_BASE64 ou FIREBASE_WEB_APP_CONFIG_BASE64 ausentes — pulando e2e-public. Configure os secrets para habilitar."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check_secrets.outputs.skip != 'true'
      - uses: pnpm/action-setup@v4
        if: steps.check_secrets.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.check_secrets.outputs.skip != 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - if: steps.check_secrets.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        if: steps.check_secrets.outputs.skip != 'true'
        working-directory: apps/store
        run: pnpm exec playwright install --with-deps chromium
      - name: Run public E2E
        if: steps.check_secrets.outputs.skip != 'true'
        timeout-minutes: 6
        working-directory: apps/store
        # `--project=public` filtra os specs públicos pela convenção de nomes
        # (ignora *.auth.spec.ts e *.mp.spec.ts) — robusto a renomear/adicionar.
        run: pnpm exec playwright test --project=public
      - name: Upload Playwright report
        if: always() && steps.check_secrets.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-public
          path: apps/store/playwright-report
          retention-days: 7

  report-failure:
    name: Post failure logs on PR
    # Replica do `Test → report-failure`, limitado aos jobs deste workflow.
    # Sem isso, falha em e2e-public não vira comentário no PR — o report-failure
    # do Test workflow só enxerga jobs do seu próprio run.
    needs: [e2e-public]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Fetch failed job logs and comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | [.id, .name] | @tsv' > /tmp/failed-jobs.tsv
          if [ ! -s /tmp/failed-jobs.tsv ]; then
            echo "Nenhum job em falha encontrado — nada a reportar."
            exit 0
          fi
          {
            echo "## ❌ CI falhou (E2E Public)"
            echo
            echo "Workflow \`${{ github.workflow }}\` no commit <code>${HEAD_SHA:0:7}</code> · [ver run completo]($RUN_URL)"
            echo
          } > /tmp/body.md
          while IFS=$'\t' read -r job_id job_name; do
            if ! gh api "repos/$REPO/actions/jobs/$job_id/logs" > "/tmp/job-$job_id.log" 2>/dev/null; then
              echo "(log indisponível — abra o run no GitHub)" > "/tmp/job-$job_id.log"
            fi
            {
              echo "<details>"
              echo "<summary>Job <code>$job_name</code> — últimos 12KB do log</summary>"
              echo
              echo '```'
              tail -c 12000 "/tmp/job-$job_id.log"
              echo
              echo '```'
              echo
              echo "</details>"
              echo
            } >> /tmp/body.md
          done < /tmp/failed-jobs.tsv
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/body.md
