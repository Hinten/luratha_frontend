# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  maxInstances: 10
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
env:
  # ── MercadoPago ────────────────────────────────────────────────────────────
  # Access token do servidor. TEST-... = sandbox, APP_USR-... = produção.
  # Lido em packages/payments/src/mercadoPago/client.ts.
  - variable: MERCADOPAGO_ACCESS_TOKEN
    secret: mercadopago-access-token
    availability:
      - RUNTIME

  # Ambiente da API: "sandbox" ou "production". Necessário porque as credenciais
  # TEST do painel MP nem sempre comecam com TEST-; sem essa flag, o rewrite do
  # payer.email pra @testuser.com (exigido em sandbox) nao acontece e o cartao
  # falha com `invalid_email_for_sandbox`. Lido em isMercadoPagoSandbox().
  - variable: MERCADOPAGO_ENV
    value: "sandbox"
    availability:
      - RUNTIME

  # Email do test user comprador criado no painel MP (Suas integracoes → Sua
  # aplicacao → Contas de teste). Formato: test_user_<N>@testuser.com.
  # Em sandbox o servidor sobrescreve `payer.email` por esse valor antes de
  # chamar o MP — sem isso, o cartao falha com `invalid_users_involved` (HTTP
  # 402) porque o email "qualquer @testuser.com" resolve pro mesmo usuario do
  # vendedor. Em producao a flag e ignorada.
  - variable: MERCADOPAGO_SANDBOX_PAYER_EMAIL
    value: "test_user_6882404001016965566@testuser.com"
    availability:
      - RUNTIME

  # Public key exposta ao browser para inicializar o Card Payment Brick
  # (@mercadopago/sdk-react) que tokeniza o cartao na origem MP.
  # NEXT_PUBLIC_* e inlinado no bundle em BUILD time -> precisa de BUILD,
  # senao o Brick nao carrega.
  - variable: NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY
    secret: mercadopago-public-key
    availability:
      - BUILD
      - RUNTIME

  # ── Melhor Envio (cálculo de frete) ────────────────────────────────────────
  # Token Bearer da API. Lido em runtime por resolveConfig() em
  # apps/store/src/lib/shipping/melhorEnvio/client.ts. Sem ele,
  # POST /api/checkout/shipping responde 502 (code: config_missing).
  # Como obter o token: docs/melhor-envio-setup.md.
  - variable: MELHOR_ENVIO_TOKEN
    secret: melhor-envio-token
    availability:
      - RUNTIME

  - variable: MELHOR_ENVIO_USER_AGENT
    secret: melhor-envio-user-agent
    availability:
      - RUNTIME

  # Ambiente da API: "sandbox" (default) ou "production". O token DEVE ser do
  # mesmo ambiente — token de sandbox nao funciona em producao e vice-versa.
  - variable: MELHOR_ENVIO_ENV
    value: "sandbox"
    availability:
      - RUNTIME
