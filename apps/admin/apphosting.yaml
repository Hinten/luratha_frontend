# Firebase App Hosting backend config for the admin app (luratha-app-admin).
# See https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0

# Firebase não exige segredos declarados aqui:
# - Client SDK: o App Hosting injeta FIREBASE_WEBAPP_CONFIG (config web) automaticamente
#   em build e runtime — o código lê essa variável para popular as NEXT_PUBLIC_FIREBASE_*.
# - Admin SDK: usa Application Default Credentials (ADC), fornecidas pelo Cloud Run.
# Outros segredos do backend (se houver) são configurados no painel do App Hosting.
